type: object
description: Response for creating a subscription

required:
  - success

properties:
  success:
    type: boolean
    description: Indicates whether the subscription was successful
    example: true

  content:
    type: object
    description: The subscription details
    properties:
      startDate:
        type: string
        format: date-time
        description: The unique identifier for the subscription
        example: "sub_1234567890"
      status:
        type: string
        description: The current status of the subscription
        example: "active"
      plan:
        type: string
        description: The plan associated with the subscription
        example: "premium"
      startDate:
        type: string
        format: date-time
        description: The start date of the subscription
        example: "2024-01-01T00:00:00Z"
      endDate:
        type: string
        format: date-time
        description: The end date of the subscription, if applicable
        example: "2024-12-31T23:59:59Z"