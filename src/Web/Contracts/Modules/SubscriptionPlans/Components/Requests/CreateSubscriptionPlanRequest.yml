type: object
description: Represents the data transfer object for a recording

required:
  - name
  - description
  - price
  - currency
  - tier
additionalProperties: false
properties:
  name:
    type: string
    minLength: 3
    description: The name of the recording.
  description:
    type: string
    description: A brief description of the recording.
    minLength: 3
  price:
    type: number
    format: decimal
    description: The price of the recording.
    minimum: 0
  currency:
    $ref: '../../../Common/Fields/CurrencyCode.yml'
    description: The currency code for the price of the recording.
  billingInterval:
    $ref: '../../../Common/Enums/BillingInterval.yml#/components/schemas/BillingInterval'
    description: The billing interval for the subscription plan
