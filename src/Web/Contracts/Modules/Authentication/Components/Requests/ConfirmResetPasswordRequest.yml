type: object
description: Request to confirm the new password after a password reset request

required:
  - encryptedToken
  - newPassword
  - newPasswordConfirmation
additionalProperties: false
properties: 
  encryptedToken:
    $ref: '../Fields/EncryptedCode.yml'
    description: The encrypted token sent to the user's email for password reset confirmation
    
  newPassword:
    $ref: '../../../Common/Fields/Password.yml'
    description: The new password that the user wants to set after confirming the reset
    
  newPasswordConfirmation:
    $ref: '../../../Common/Fields/Password.yml'
    description: The password confirmation of the new password to ensure that the user has entered it correctly
    
    