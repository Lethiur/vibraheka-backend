type: object
description: Represents the data transfer object for a product

properties:
  id:
    $ref: '../Common/Fields/ID.yml'
    description: Unique identifier for the product entry
  referenceID:
    $ref: '../Common/Fields/ID.yml'
    description: Reference identifier for the related entity
  name:
    type: string
    minLength: 3
    description: The product name
  isActive:
    type: boolean
    description: Indicates whether the product is active
    example: true
    default: false
  productType:
    $ref: './Enums/ProductType.yml#/components/schemas/ProductType'
    description: The type of the product
  prices: 
    type: array
    description: List of prices associated with the product
    items:
      $ref: './ProductPriceDTO.yml'
  